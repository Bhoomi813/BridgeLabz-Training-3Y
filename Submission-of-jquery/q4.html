
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offers</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f8fafc;
            padding: 30px;
        }
        .banner {
            background: #2563eb;
            color: white;
            padding: 35px;
            margin: 15px auto;
            width: 60%;
            border-radius: 10px;
        }
        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<main>
    <h1>Special Offers</h1>

    <section id="banners">
        <div class="banner">Banner 1 - 50% OFF</div>
        <div class="banner">Banner 2 - Buy 1 Get 1</div>
        <div class="banner">Banner 3 - Free Delivery</div>
        <div class="banner">Banner 4 - Festival Sale</div>
        <div class="banner">Banner 5 - Special Discount</div>
    </section>

    <button id="hide">Hide First</button>
    <button id="show">Show All</button>
    <button id="slideUp">Slide Up</button>
    <button id="slideDown">Slide Down</button>
    <button id="fadeIn">Fade In</button>
    <button id="fadeOut">Fade Out</button>
</main>

<script src="q4.js"></script>
</body>
</html>
