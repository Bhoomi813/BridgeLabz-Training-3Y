
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef2ff;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }
        button {
            padding: 10px 18px;
            margin: 10px;
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<main class="container">
    <h1 id="greeting">Welcome!</h1>

    <p id="welcomeMessage">
        We are happy to have you here.
    </p>

    <button id="changeGreeting">Change Greeting</button>
    <button id="toggleMessage">Toggle Message</button>
    <button id="greetingAlert">Click Greeting</button>
</main>

<script src="q1.js"></script>
</body>
</html>
