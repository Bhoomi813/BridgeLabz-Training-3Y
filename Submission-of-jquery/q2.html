
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Highlight</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 20px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .product {
            background: white;
            padding: 20px;
            width: 180px;
            border-radius: 10px;
            cursor: pointer;
        }
        .highlight {
            background: #bbf7d0;
        }
        .selected {
            border: 3px solid #2563eb;
        }
        .discount {
            color: red;
            font-weight: bold;
        }
        .details {
            display: none;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<main>
    <h1>Our Products</h1>

    <section class="products">

        <article class="product" data-stock="yes" data-discount="20">
            <h3>Laptop</h3>
            <p>Price: ₹50000</p>
            <p class="discount">20% OFF</p>
            <p class="details">8GB RAM, 512GB SSD</p>
            <button class="favorite">♡ Favorite</button>
        </article>

        <article class="product" data-stock="yes">
            <h3>Mobile</h3>
            <p>Price: ₹20000</p>
            <p class="details">128GB Storage</p>
            <button class="favorite">♡ Favorite</button>
        </article>

        <article class="product" data-stock="no">
            <h3>Headphones</h3>
            <p>Price: ₹2000</p>
            <p class="details">Wireless Headphones</p>
            <button class="favorite">♡ Favorite</button>
        </article>

        <article class="product" data-stock="yes" data-discount="10">
            <h3>Watch</h3>
            <p>Price: ₹3000</p>
            <p class="discount">10% OFF</p>
            <p class="details">Smart Watch</p>
            <button class="favorite">♡ Favorite</button>
        </article>

        <article class="product" data-stock="yes">
            <h3>Keyboard</h3>
            <p>Price: ₹1500</p>
            <p class="details">Mechanical Keyboard</p>
            <button class="favorite">♡ Favorite</button>
        </article>

    </section>
</main>

<script src="q2.js"></script>
</body>
</html>
