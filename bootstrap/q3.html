<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q3.css">
</head>

<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Tech Store</h1>
    <p class="mb-0">Quality Products at Best Prices</p>
</header>

<main class="container py-5">

    <h2 class="text-center mb-4">
        Our Products
    </h2>

    <!-- Bootstrap Grid -->
    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card h-100">

                <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef"
                     class="card-img-top"
                     alt="Laptop">

                <div class="card-body text-center">
                    <h5 class="card-title">Laptop</h5>

                    <p class="fw-bold">
                        ₹55,000
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card h-100">

                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
                     class="card-img-top"
                     alt="Smartphone">

                <div class="card-body text-center">
                    <h5 class="card-title">Smartphone</h5>

                    <p class="fw-bold">
                        ₹25,000
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card h-100">

                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                     class="card-img-top"
                     alt="Headphones">

                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>

                    <p class="fw-bold">
                        ₹3,500
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card h-100">

                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                     class="card-img-top"
                     alt="Smart Watch">

                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>

                    <p class="fw-bold">
                        ₹5,000
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

    </div>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 Tech Store
</footer>

</body>
</html>
