<body>
    <section class="typography">
        <h1>Responsive Typography</h1>
        <p>
            Responsive typography automatically adjusts the text size
            according to the screen width. The CSS clamp() function sets
            a minimum, preferred, and maximum font size so text remains
            readable on desktops, tablets, and mobile devices.
        </p>
    </section>
</body>
