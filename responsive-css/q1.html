
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <h1>Image Filter Gallery</h1>

    <div class="gallery">
        <figure>
            <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80" alt="Nature">
            <figcaption>Blur</figcaption>
        </figure>
        <figure>
            <img class="gray" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80" alt="Mountain">
            <figcaption>Grayscale</figcaption>
        </figure>
        <figure>
            <img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80" alt="Forest">
            <figcaption>Sepia</figcaption>
        </figure>
        <figure>
            <img class="bright" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80" alt="Lake">
            <figcaption>Brightness</figcaption>
        </figure>
        <figure>
            <img class="contrast" src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=600&q=80" alt="Trees">
            <figcaption>Contrast</figcaption>
        </figure>
        <figure>
            <img class="hue" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=600&q=80" alt="Sunrise">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </div>
</body>
</html>
