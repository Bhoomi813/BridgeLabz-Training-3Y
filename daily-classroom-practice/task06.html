<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Card</title>

    <link rel="stylesheet" href="task6.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="box">

            <!-- Product Image -->
            <div class="card">

                <div class="box1">
                    <h3 class="discount">20% OFF</h3>
                </div>

                <img src="https://cdn.clippingpath.in/wp-content/uploads/2020/03/Original-Image.jpg"
                    alt="Premium Running Shoes">

                <!-- Heart -->
                <div class="heart">
                    <i class="fa-regular fa-heart"></i>
                </div>

            </div>

            <!-- Product Details -->

            <h2 class="category">SPORTS SHOES</h2>

            <h2 class="product-name">Premium Running Shoes</h2>

            <!-- Rating -->
            <div class="container1">

                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>

                <span>(120)</span>

            </div>

            <!-- Price -->
            <p class="price">
                &#8377;1,999
                <del>&#8377;2,499</del>
            </p>

            <!-- Button -->
            <button class="btn">Add to Cart</button>

        </div>

    </div>

</body>
</html>
