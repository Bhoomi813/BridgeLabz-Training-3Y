<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="ques5style.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <main>

        <div class="card">
            <h2>Basic</h2>
            <h3>₹499</h3>
            <p>Basic features</p>
            <p>Email Support</p>
        </div>

        <div class="card middle">
            <h2>Premium</h2>
            <h3>₹999</h3>
            <p>All basic features</p>
            <p>Priority Support</p>
        </div>

        <div class="card">
            <h2>Pro</h2>
            <h3>₹1499</h3>
            <p>All premium features</p>
            <p>24/7 Support</p>
        </div>

    </main>

</body>
</html>
