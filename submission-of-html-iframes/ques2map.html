<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <h1>My City Map</h1>

    <!--
        loading="lazy" means the map will load only when
        it is close to becoming visible on the screen.
    -->

    <iframe
        src="https://www.google.com/maps?q=Delhi&output=embed"
        title="Google Map of Delhi"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
