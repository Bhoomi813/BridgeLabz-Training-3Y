<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Buttons</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles and states</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="button-container">

            <!-- Primary Button -->
            <button class="btn primary">
                Primary
            </button>

            <!-- Secondary Button -->
            <button class="btn secondary">
                Secondary
            </button>

            <!-- Outline Button -->
            <button class="btn outline">
                Outline
            </button>

            <!-- Disabled Button -->
            <button class="btn disabled" disabled>
                Disabled
            </button>

        </section>

        <section class="info">
            <p>
                Hover, click and focus the buttons to see different effects.
            </p>
        </section>

    </main>

    <!-- Footer -->x
    <footer>
        <p>CSS Button Practice</p>
    </footer>

</body>
</html>
