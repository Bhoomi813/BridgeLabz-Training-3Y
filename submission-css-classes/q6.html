<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>

    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Animations using @keyframes</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="animation-container">

            <!-- Moving Box -->
            <div class="animation-item">
                <div class="moving-box"></div>
                <p>Moving Box</p>
            </div>

            <!-- Bouncing Ball -->
            <div class="animation-item">
                <div class="ball"></div>
                <p>Bouncing Ball</p>
            </div>

            <!-- Color Changing Text -->
            <div class="animation-item">
                <h2 class="color-text">Color Changing</h2>
                <p>Animated Text</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Animation Practice</p>
    </footer>

</body>
</html>
