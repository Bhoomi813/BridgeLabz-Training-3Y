<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>

    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see tooltips</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip">
                Home
                <span class="tooltip-text">Go to Home</span>
            </div>

            <!-- Tooltip 2 -->
            <div class="tooltip">
                Search
                <span class="tooltip-text">Search something</span>
            </div>

            <!-- Tooltip 3 -->
            <div class="tooltip">
                Profile
                <span class="tooltip-text">View your profile</span>
            </div>

            <!-- Tooltip 4 -->
            <div class="tooltip">
                Settings
                <span class="tooltip-text">Open settings</span>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Tooltip Practice Using Only CSS</p>
    </footer>

</body>
</html>
