<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Showcase</h1>
        <p>Hover over the images</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="gallery">

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/400/300?random=1" alt="Nature">
                    <div class="overlay"></div>
                </div>
                <figcaption>Nature</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/400/300?random=2" alt="Mountain">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/400/300?random=3" alt="Forest">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/400/300?random=4" alt="Ocean">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/400/300?random=5" alt="City">
                    <div class="overlay"></div>
                </div>
                <figcaption>City</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/400/300?random=6" alt="Sunset">
                    <div class="overlay"></div>
                </div>
                <figcaption>Sunset</figcaption>
            </figure>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Image Showcase Practice</p>
    </footer>

</body>
</html>
