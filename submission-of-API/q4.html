<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi API Dashboard</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <div class="container">

        <h1>Multi-API Dashboard</h1>

        <p id="warning"></p>

        <div class="dashboard">

            <div class="card">
                <h3>Total Users</h3>
                <p id="users" class="count skeleton"> </p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p id="orders" class="count skeleton"> </p>
            </div>

            <div class="card">
                <h3>Total Products</h3>
                <p id="products" class="count skeleton"> </p>
            </div>

        </div>

    </div>

    <script src="q4.js"></script>

</body>
</html>
