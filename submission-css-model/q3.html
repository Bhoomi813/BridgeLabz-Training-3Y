<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <!-- Fixed Header -->
    <header>
        <h1>Gradient Background Page</h1>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Linear Gradient Section -->
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear gradient.
                The colors change from left to right.
            </p>
        </section>

        <!-- Radial Gradient Section -->
        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial gradient.
                The colors spread from the center.
            </p>
        </section>

    </main>

    <!-- Fixed Footer -->
    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
