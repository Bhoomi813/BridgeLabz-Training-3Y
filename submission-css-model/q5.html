<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section class="content">

            <h2>My List</h2>

            <!-- List -->
            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
                <li>Python</li>
            </ul>

            <!-- Form -->
            <div class="form">
                <input type="text" placeholder="Enter your name">

                <input type="email" placeholder="Enter your email">

                <a href="https://www.google.com">Visit Google</a>

                <a href="https://www.github.com">Visit GitHub</a>
            </div>

            <!-- Combinator example -->
            <div class="parent">
                <p>Direct child paragraph</p>

                <div>
                    <p>Nested paragraph</p>
                </div>

                <p>Another paragraph</p>
                <p>Another paragraph after it</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Advanced Selector Practice</p>
    </footer>

</body>
</html>
