<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>

    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CSS Transformations</h1>
        <p>Move your mouse over the boxes</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="transform-container">

            <!-- Rotate -->
            <div class="item">
                <div class="box rotate">
                    Rotate
                </div>
                <p>rotate()</p>
            </div>

            <!-- Scale -->
            <div class="item">
                <div class="box scale">
                    Scale
                </div>
                <p>scale()</p>
            </div>

            <!-- Translate -->
            <div class="item">
                <div class="box translate">
                    Translate
                </div>
                <p>translate()</p>
            </div>

            <!-- Skew -->
            <div class="item">
                <div class="box skew">
                    Skew
                </div>
                <p>skew()</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Transform Practice</p>
    </footer>

</body>
</html>
