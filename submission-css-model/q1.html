<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Borders and Padding</title>

    <!-- Connecting CSS file -->
    <link rel="stylesheet" href="q1.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Borders and Padding Demonstration</h1>
        <p>Different border styles and padding values</p>
    </header>

    <!-- Main Content -->
    <main>

        <section class="box-container">

            <!-- Solid Border -->
            <div class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 20px</p>
            </div>

            <!-- Dashed Border -->
            <div class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 15px</p>
            </div>

            <!-- Double Border -->
            <div class="box double">
                <h2>Double Border</h2>
                <p>Padding: 25px</p>
            </div>

            <!-- Groove Border -->
            <div class="box groove">
                <h2>Groove Border</h2>
                <p>Padding: 10px</p>
            </div>

        </section>

        <!-- Rounded Corner Section -->
        <section class="rounded-section">

            <h2>Rounded Corners</h2>

            <div class="rounded-box">
                <p>This box uses border-radius.</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>CSS Borders and Padding Practice</p>
    </footer>

</body>
</html>
