<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 15px;
        }

        .gallery img {
            width: 150px;
            height: 120px;
            object-fit: cover;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #modal img {
            width: 500px;
            max-width: 80%;
        }
    </style>
</head>

<body>

    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/101/500/400">
        <img src="https://picsum.photos/id/102/500/400">
        <img src="https://picsum.photos/id/103/500/400">
        <img src="https://picsum.photos/id/104/500/400">
        <img src="https://picsum.photos/id/105/500/400">
        <img src="https://picsum.photos/id/106/500/400">
    </div>

    <div id="modal">
        <img id="modalImage">
    </div>

    <script src="q5.js"></script>
</body>
</html>
