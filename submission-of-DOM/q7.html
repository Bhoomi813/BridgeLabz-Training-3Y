<!DOCTYPE html>
<html>
<head>
    <title>Mouse Tracker</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        #box {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <h2>Mouse Coordinates</h2>

    <p id="coordinates">X: 0, Y: 0</p>

    <div id="box"></div>

    <script src="q7.js"></script>
</body>
</html>
